# Every commit runs what a release runs.
#
# `npm run verify` is the whole gate: typecheck, the OpenAPI drift check, the
# verification and traceability ledger drift checks, 1,769 tests across six
# suites, and a production build. Nothing here is a CI-only shortcut, and
# nothing a developer runs locally is skipped here — the two are the same
# command, which is the only way the local result and the CI result stay
# comparable.
#
# The database tests run the production migrations unmodified against
# PostgreSQL 18 compiled to WebAssembly, so this needs no database service and
# no credentials of any kind. That is deliberate: a pipeline that needs secrets
# to run its tests is a pipeline that cannot run on a fork's pull request.
name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch makes the older run redundant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version everything in this repository has been verified against.
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      # Runs after the build, because it reads what the build emitted.
      - name: Check the client bundle carries no server secret
        run: npm run bundle:check

      - name: Keep the build output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: ignore
