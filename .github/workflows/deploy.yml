# Deployment is deliberate, not automatic.
#
# This workflow never runs on a push. It is dispatched by a person who names
# the environment, and it runs behind a GitHub Environment, so whatever
# approval rules that environment carries apply before anything reaches a real
# database.
#
# It re-runs the full verification first. A deployment that skips the gate to
# save eight minutes is how a broken migration reaches production.
#
# ## Secrets this expects
#
# Set these as GitHub Environment secrets. Nothing here echoes a secret, writes
# one to a log, or passes one to the browser build:
#
#   SUPABASE_ACCESS_TOKEN   a personal access token for the Supabase CLI
#   SUPABASE_PROJECT_REF    the project reference, e.g. abcdefghijklmnop
#   SUPABASE_DB_PASSWORD    the database password, for `db push`
#   VITE_SUPABASE_URL       public, embedded in the browser bundle by design
#   VITE_SUPABASE_ANON_KEY  public, protected by row level security
#   SUPABASE_DB_URL         optional; a psql connection string. Set it and this
#                           workflow loads the seed catalog. Leave it unset and
#                           the seed step is skipped and says so — the catalog
#                           then has to be loaded by hand per docs/DEPLOYMENT.md,
#                           and until it is, the platform has no cost codes, no
#                           rates, no plans to subscribe to and no AI agent row.
#
# The Stripe secret key, the Stripe webhook signing secret, the service-role
# key and the AI provider key are NOT here and must not be. They are set once
# against the Supabase project as Edge Function secrets, where the functions
# read them and nothing else can. `npm run bundle:check` fails the build if any
# of them ever reaches the browser.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        required: true
        type: choice
        options: [staging, production]
      migrate:
        description: Apply pending database migrations
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # The same gate as every commit. No shortcut for a deployment.
      - name: Verify
        run: npm run verify

      - name: Check the client bundle carries no server secret
        run: npm run bundle:check

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Shows what would change before anything changes, so the log records
      # the diff a person can check against the migration they intended.
      - name: Show pending migrations
        if: ${{ inputs.migrate }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Apply migrations
        if: ${{ inputs.migrate }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      # `supabase db push` applies migrations and nothing else. The catalog —
      # 4,671 library records, the plan catalog the checkout validates against,
      # and the AI agent row every finding references — lives in supabase/seed
      # and was applied by nobody: the runbook says to run these by hand and the
      # workflow did not, so a deployment that followed the workflow alone came
      # up with an empty library and no plans to sell.
      #
      # Every statement in both files is idempotent, so this is safe to re-run
      # on every deployment.
      - name: Load the seed catalog
        if: ${{ inputs.migrate }}
        env:
          SEED_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SEED_URL" ]; then
            echo "SUPABASE_DB_URL is not set; skipping the seed catalog."
            echo "Load it by hand per docs/DEPLOYMENT.md before anybody signs up:"
            echo "  psql \"\$DATABASE_URL\" -f supabase/seed/0001_global_library.sql"
            echo "  psql \"\$DATABASE_URL\" -f supabase/seed/0002_plan_catalog.sql"
            exit 0
          fi
          psql "$SEED_URL" -v ON_ERROR_STOP=1 -f supabase/seed/0001_global_library.sql
          psql "$SEED_URL" -v ON_ERROR_STOP=1 -f supabase/seed/0002_plan_catalog.sql

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in supabase/functions/*/; do
            name="$(basename "$fn")"
            [ "$name" = "_shared" ] && continue
            echo "Deploying $name"
            supabase functions deploy "$name" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          done

      # Built here rather than reusing the verify artifact, because the browser
      # bundle embeds the environment's own public URL and anon key.
      - name: Build the web application for this environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Check the environment build carries no server secret
        run: npm run bundle:check

      # Named for what it does. This uploads the bundle; it does not publish it.
      # The frontend host is a choice the runbook leaves open — Vercel, Netlify,
      # Cloudflare Pages, S3 — so the last step of a deployment is somebody
      # taking this artifact to whichever one they picked. Calling that
      # "publish" would be the same overstatement this build spent thirty phases
      # removing.
      - name: Upload the built bundle for the frontend host
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ inputs.environment }}
          path: apps/web/dist
          retention-days: 30
