  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.grounup.example/oauth/token
          scopes:
            financial.read: Read financial records
            financial.write: Create and update financial records
            financial.approve: Approve controlled financial actions
