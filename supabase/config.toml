# Supabase project configuration.
#
# This describes the project the CLI links to and the local stack `supabase
# start` brings up. It carries no secret of any kind: keys are set against the
# hosted project as Edge Function secrets, and against GitHub as Environment
# secrets, and neither is stored here.
#
# `project_id` is the local stack's container name, not the hosted project
# reference — the deploy workflow passes that as SUPABASE_PROJECT_REF.
project_id = "grounup-enterprise"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
# `app` holds the platform's governance functions and is reached only through
# SECURITY DEFINER helpers the API schema exposes. It is deliberately not
# published: nothing should be able to call app.* directly over PostgREST.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# The version the migrations are written for and tested against. The test
# suite runs them against PostgreSQL 18 compiled to WebAssembly, so this and
# the tests agree by construction rather than by intention.
major_version = 17

# The master library and the plan catalog, applied by `db push --include-seed`.
# `0003_plan_prices.example.sql` is deliberately absent: it carries example
# Stripe price identifiers, and seeding a real project with them would point
# checkout at prices that do not exist in that Stripe account.
[db.seed]
enabled = true
sql_paths = ["./seed/0001_global_library.sql", "./seed/0002_plan_catalog.sql"]

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Plan sets and drawings are large. The runbook creates the buckets and their
# policies; this is only the ceiling.
file_size_limit = "200MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ---------------------------------------------------------------------------
# Signing in with somebody else's account
#
# Most people arriving at a construction platform already have a Google account
# on the phone in their hand, and the difference between one tap and inventing
# a password is the difference between a signup and a bounce.
#
# Both are off until the credentials exist. The client id and secret come from
# the environment and are never written here — this file is in the repository
# and a secret in it is a secret published. Set them as Supabase secrets, or in
# a local `.env` that git ignores:
#
#   SUPABASE_AUTH_GOOGLE_CLIENT_ID, SUPABASE_AUTH_GOOGLE_SECRET
#   SUPABASE_AUTH_APPLE_CLIENT_ID,  SUPABASE_AUTH_APPLE_SECRET
#
# Then set VITE_OAUTH_PROVIDERS="google,apple" so the buttons appear. Enabling
# one here without the other shows a button that leads to an error page, which
# is why the application never guesses which providers exist.
# ---------------------------------------------------------------------------
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

# Every function is deployed with JWT verification ON except the Stripe
# webhook, which Stripe cannot send a Supabase JWT to. Its authentication is
# the signature check over the raw body, which is stronger: a forged request
# without the signing secret is rejected before the payload is parsed.
[functions.stripe-webhook]
verify_jwt = false

[functions.health]
# Liveness has to answer before anything is authenticated, or a readiness probe
# cannot distinguish "down" from "unauthorized".
verify_jwt = false

[analytics]
enabled = false
